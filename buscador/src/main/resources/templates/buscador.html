<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Actividades - DCC</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <header>
        <h1>Buscador de Actividades</h1>
    </header>

    <main>
        <section>
            <label for="inputBusqueda">Buscar actividades:</label>
            <input type="text" id="inputBusqueda" placeholder="Escribe al menos 3 caracteres..." autocomplete="off"
                maxlength="100">
            <p class="hint">La búsqueda se realiza automáticamente al escribir 3 o más caracteres.</p>
        </section>

        <section id="seccion-resultados" aria-live="polite">
        </section>

        <nav>
            <a href="http://127.0.0.1:5000/">&#8592; Volver al inicio</a>
        </nav>
    </main>

    <div id="modal-evaluar" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" style="display:none;">
        <div id="modal-contenido">
            <h3 id="modal-titulo">Evaluar actividad</h3>
            <p id="modal-nombre-act"></p>
            <label for="select-nota">Selecciona una nota (1 a 7):</label>
            <select id="select-nota">
                <option value="">-- Selecciona --</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
            </select>
            <p id="modal-error" class="error-campo" style="display:none;"></p>
            <div id="modal-botones">
                <button type="button" id="btn-confirmar-nota">Confirmar</button>
                <button type="button" id="btn-cancelar-nota">Cancelar</button>
            </div>
        </div>
    </div>
    <div id="modal-overlay" style="display:none;"></div>

    <script>
        var debounceTimer = null;
        var actividadActual = null;


        document.getElementById('inputBusqueda').addEventListener('input', function () {
            var q = this.value.trim();
            clearTimeout(debounceTimer);

            if (q.length < 3) {
                document.getElementById('seccion-resultados').innerHTML = '';
                return;
            }

            debounceTimer = setTimeout(function () {
                realizarBusqueda(q);
            }, 300);
        });

        function realizarBusqueda(q) {
            var seccion = document.getElementById('seccion-resultados');
            seccion.innerHTML = '<p class="cargando">Buscando...</p>';

            fetch('/api/buscar?q=' + encodeURIComponent(q))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.error) {
                        seccion.innerHTML = '<p class="msg-error">' + escapeHtml(data.error) + '</p>';
                        return;
                    }
                    if (data.length === 0) {
                        seccion.innerHTML = '<p class="sin-resultados">No se encontraron actividades para <strong>' + escapeHtml(q) + '</strong>.</p>';
                        return;
                    }
                    renderResultados(data, q);
                })
                .catch(function () {
                    seccion.innerHTML = '<p class="msg-error">Error de conexión. Intente nuevamente.</p>';
                });
        }


        function renderResultados(lista, q) {
            var html = '<h2>Resultados (' + lista.length + ')</h2>';

            lista.forEach(function (a) {
                var notaTexto = (a.nota === null || a.nota === undefined)
                    ? '-'
                    : String(a.nota);

                html += '<article class="act-card">';
                html += '  <div class="act-header">';
                html += '    <span class="act-nombre">' + resaltar(a.nombre, q) + '</span>';
                html += '    <span class="badge badge-act">' + escapeHtml(capitalizar(a.tipo)) + '</span>';
                html += '  </div>';
                html += '  <table class="tabla-detalle">';
                html += '    <tr><th>Miembro</th><td>' + escapeHtml(a.miembroNombre) + '</td></tr>';
                html += '    <tr><th>Días</th><td>' + resaltar(a.dias, q) + '</td></tr>';
                html += '    <tr><th>Horario</th><td>' + escapeHtml(a.horario) + '</td></tr>';
                html += '    <tr><th>Comuna</th><td>' + resaltar(a.comuna, q) + '</td></tr>';
                html += '    <tr><th>Nota</th>'
                    + '      <td><span class="nota-valor" id="nota-' + a.id + '">' + notaTexto + '</span>'
                    + '      &nbsp;<button type="button" class="btn-evaluar" '
                    + '             data-id="' + a.id + '" '
                    + '             data-nombre="' + escapeAttr(a.nombre) + '" '
                    + '             onclick="abrirModal(this)">Evaluar</button>'
                    + '      </td></tr>';
                html += '  </table>';
                html += '</article>';
            });

            document.getElementById('seccion-resultados').innerHTML = html;
        }


        function abrirModal(btn) {
            actividadActual = parseInt(btn.getAttribute('data-id'));
            var nombre = btn.getAttribute('data-nombre');

            document.getElementById('modal-nombre-act').textContent = 'Actividad: ' + nombre;
            document.getElementById('select-nota').value = '';
            document.getElementById('modal-error').style.display = 'none';

            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById('modal-evaluar').style.display = 'block';
            document.getElementById('select-nota').focus();
        }

        function cerrarModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('modal-evaluar').style.display = 'none';
            actividadActual = null;
        }

        document.getElementById('btn-cancelar-nota').addEventListener('click', cerrarModal);
        document.getElementById('modal-overlay').addEventListener('click', cerrarModal);

        document.getElementById('btn-confirmar-nota').addEventListener('click', function () {
            var selectEl = document.getElementById('select-nota');
            var valorStr = selectEl.value;
            var errEl = document.getElementById('modal-error');

            if (valorStr === '') {
                errEl.textContent = 'Debes seleccionar una nota.';
                errEl.style.display = 'block';
                return;
            }

            var nota = parseInt(valorStr);
            if (isNaN(nota) || nota < 1 || nota > 7) {
                errEl.textContent = 'La nota debe ser un entero entre 1 y 7.';
                errEl.style.display = 'block';
                return;
            }

            errEl.style.display = 'none';
            document.getElementById('btn-confirmar-nota').disabled = true;

            fetch('/api/notas/' + actividadActual, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nota: nota })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.ok) {
                        var spanNota = document.getElementById('nota-' + actividadActual);
                        if (spanNota) {
                            spanNota.textContent = String(data.promedio);
                        }
                        cerrarModal();
                    } else {
                        errEl.textContent = data.error || 'Error al guardar la nota.';
                        errEl.style.display = 'block';
                    }
                })
                .catch(function () {
                    errEl.textContent = 'Error de conexión. Intente nuevamente.';
                    errEl.style.display = 'block';
                })
                .finally(function () {
                    document.getElementById('btn-confirmar-nota').disabled = false;
                });
        });


        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            if (!str) return '';
            return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function resaltar(texto, q) {
            if (!texto) return '';
            var escaped = escapeHtml(texto);
            var escapedQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            var re = new RegExp('(' + escapedQ + ')', 'gi');
            return escaped.replace(re, '<mark>$1</mark>');
        }

        function capitalizar(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1);
        }
    </script>

</body>

</html>
